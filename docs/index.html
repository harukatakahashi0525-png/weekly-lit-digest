<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>週刊文献ダイジェスト</title>
<style>
  :root{
    --bg:#f4f2ee; --card:#ffffff; --ink:#1f2328; --sub:#6a6f76; --line:#e3ded6;
    --navy:#14325c; --accent:#c8553d; --chip:#eef2f7; --chip-ink:#14325c; --soft:#faf8f4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171c; --card:#1d2128; --ink:#e7e9ec; --sub:#9aa1aa; --line:#2c323b;
      --navy:#9cc0f0; --accent:#ec8a72; --chip:#26303d; --chip-ink:#c9dcf5; --soft:#232830;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171c; --card:#1d2128; --ink:#e7e9ec; --sub:#9aa1aa; --line:#2c323b;
    --navy:#9cc0f0; --accent:#ec8a72; --chip:#26303d; --chip-ink:#c9dcf5; --soft:#232830;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Meiryo",Arial,sans-serif;line-height:1.65}
  header{background:#14325c;color:#fff;padding:22px 16px 18px}
  header .in,main{max-width:860px;margin:0 auto}
  h1{margin:0;font-size:21px;letter-spacing:.02em}
  header p{margin:4px 0 0;font-size:13px;opacity:.8}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
  .bar .in{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  input[type=search],select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
  input[type=search]{flex:1 1 220px;min-width:0}
  select{flex:0 1 auto;max-width:100%}
  .tog{font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .tog.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chips{max-width:860px;margin:10px auto 0;display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
  .chip.on{background:var(--navy);border-color:var(--navy);color:var(--bg)}
  main{padding:14px 16px 40px}
  .count{font-size:13px;color:var(--sub);margin:4px 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
  .top{display:flex;justify-content:space-between;gap:10px}
  .meta{font-size:12px;color:var(--sub)}
  .b{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;background:var(--chip);color:var(--chip-ink);margin:0 4px 3px 0}
  .b.d{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
  .star{flex:none;font-size:22px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:0 2px}
  .star.on{color:#e0a100}
  .en{font-size:13px;margin:6px 0 2px;color:var(--sub)}
  .en a{color:inherit}
  .ja{font-size:16px;font-weight:700;margin:2px 0 8px}
  ul.pts{margin:0;padding:0;list-style:none;font-size:14px}
  ul.pts li{margin:3px 0}
  ul.pts b{color:var(--accent);font-size:12px;margin-right:5px}
  details{margin-top:10px;font-size:13px}
  details summary{cursor:pointer;color:var(--navy)}
  .abs{white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:6px}
  .foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;font-size:12px;color:var(--sub)}
  .foot a{color:var(--navy)}
  .lnk{font:inherit;font-size:12px;background:none;border:0;color:var(--navy);cursor:pointer;padding:0;text-decoration:underline}
  .empty{text-align:center;color:var(--sub);padding:40px 0}
  mark{background:color-mix(in srgb,#ffd54a 55%,transparent);color:inherit;border-radius:2px}
  .note{font-size:11px;color:var(--sub);text-align:center;margin-top:24px}
</style>
</head>
<body>
<header><div class="in">
  <h1>週刊 文献ダイジェスト</h1>
  <p id="sub">読み込み中…</p>
</div></header>

<div class="bar"><div class="in">
  <input type="search" id="q" placeholder="キーワード検索(日本語・英語・著者)">
  <select id="week"></select>
  <select id="journal"></select>
  <select id="design"></select>
  <button class="tog" id="starOnly">★ ブックマーク</button>
</div>
<div class="chips" id="topics"></div>
</div>

<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
  <p class="note">要約・翻訳は Claude による自動生成です。数値や結論は必ず原文で確認してください。</p>
</main>

<script>
const TOPICS = ["心停止・蘇生","BLS・バイスタンダーCPR","AED・除細動","熱中症","病院前救急・EMS体制","通報・指令","AI・デジタル","集中治療","外傷","その他"];
const LBL = ["目的","方法","結果"];
const KEY = "lit-digest-stars";
let DATA = [], stars = new Set(), state = {q:"", week:"", journal:"", design:"", topic:"", starOnly:false};

try { stars = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
const saveStars = () => { try { localStorage.setItem(KEY, JSON.stringify([...stars])); } catch(e) {} };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hl = s => {
  const t = esc(s); if (!state.q) return t;
  const words = state.q.split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  return words.length ? t.replace(new RegExp("(" + words.map(w=>esc(w)).join("|") + ")", "gi"), "<mark>$1</mark>") : t;
};

function options(sel, label, values, fmt = v => v) {
  sel.innerHTML = `<option value="">${label}</option>` + values.map(v => `<option value="${esc(v)}">${esc(fmt(v))}</option>`).join("");
}

function citation(p) {
  return `${p.authors_short}. ${p.title} ${p.journal}. ${p.pubdate}.` + (p.doi ? ` doi:${p.doi}` : "") + ` PMID: ${p.pmid}`;
}

function render() {
  const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const rows = DATA.filter(p => {
    if (state.week && p.week !== state.week) return false;
    if (state.journal && p.journal !== state.journal) return false;
    if (state.design && p.design !== state.design) return false;
    if (state.topic && !(p.topics || []).includes(state.topic)) return false;
    if (state.starOnly && !stars.has(p.pmid)) return false;
    if (words.length) {
      const hay = [p.title, p.title_ja, (p.points||[]).join(" "), p.abstract_ja, p.authors_short, p.journal].join(" ").toLowerCase();
      if (!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });
  $("count").textContent = `${rows.length} 本を表示中(全 ${DATA.length} 本)`;
  $("list").innerHTML = rows.length ? rows.map(p => `
    <article class="card">
      <div class="top">
        <div class="meta">
          <span class="b d">${esc(p.design)}</span>${(p.topics||[]).map(t => `<span class="b">${esc(t)}</span>`).join("")}<br>
          ${esc(p.journal)}${p.pubdate ? " ・ " + esc(p.pubdate) : ""} ・ ${esc(p.week)} 号
        </div>
        <button class="star ${stars.has(p.pmid) ? "on" : ""}" data-star="${esc(p.pmid)}" aria-label="ブックマーク">★</button>
      </div>
      <div class="en"><a href="https://pubmed.ncbi.nlm.nih.gov/${esc(p.pmid)}/" target="_blank" rel="noopener">${hl(p.title)}</a></div>
      ${p.title_ja ? `<div class="ja">${hl(p.title_ja)}</div>` : ""}
      <ul class="pts">${(p.points||[]).map((t,i) => `<li><b>${LBL[i]||""}</b>${hl(t)}</li>`).join("")}</ul>
      ${p.abstract_ja && p.abstract_ja !== "(抄録なし)" ? `<details><summary>アブストラクト全訳</summary><div class="abs">${hl(p.abstract_ja)}</div></details>` : ""}
      <div class="foot">
        <span>${esc(p.authors_short)}</span>
        <a href="https://pubmed.ncbi.nlm.nih.gov/${esc(p.pmid)}/" target="_blank" rel="noopener">PubMed</a>
        ${p.doi ? `<a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">本文(DOI)</a>` : ""}
        <button class="lnk" data-cite="${esc(p.pmid)}">引用をコピー</button>
      </div>
    </article>`).join("") : `<div class="empty">該当する論文はありません</div>`;
}

document.addEventListener("click", e => {
  const s = e.target.closest("[data-star]");
  if (s) { const id = s.dataset.star; stars.has(id) ? stars.delete(id) : stars.add(id); saveStars(); render(); return; }
  const c = e.target.closest("[data-cite]");
  if (c) {
    const p = DATA.find(x => x.pmid === c.dataset.cite);
    navigator.clipboard?.writeText(citation(p)).then(() => { c.textContent = "コピーしました"; setTimeout(() => c.textContent = "引用をコピー", 1500); });
    return;
  }
  const t = e.target.closest("[data-topic]");
  if (t) { state.topic = state.topic === t.dataset.topic ? "" : t.dataset.topic; drawTopics(); render(); }
});

function drawTopics() {
  const used = TOPICS.filter(t => DATA.some(p => (p.topics||[]).includes(t)));
  $("topics").innerHTML = used.map(t => `<button class="chip ${state.topic === t ? "on" : ""}" data-topic="${esc(t)}">${esc(t)}</button>`).join("");
}

$("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
["week","journal","design"].forEach(k => $(k).addEventListener("change", e => { state[k] = e.target.value; render(); }));
$("starOnly").addEventListener("click", e => { state.starOnly = !state.starOnly; e.target.classList.toggle("on", state.starOnly); render(); });

const src = new URLSearchParams(location.search).get("data") || "data/papers.json";
fetch(src, {cache: "no-store"}).then(r => r.json()).then(d => {
  DATA = d.papers || [];
  const weeks = d.weeks || [...new Set(DATA.map(p => p.week))].sort().reverse();
  $("sub").textContent = `累計 ${DATA.length} 本 ・ 最終更新 ${(d.updated || "").replace("T", " ").slice(0,16) || "—"}`;
  options($("week"), "全期間", weeks, w => w + " 号");
  options($("journal"), "すべてのジャーナル", [...new Set(DATA.map(p => p.journal))].sort());
  options($("design"), "すべての研究デザイン", [...new Set(DATA.map(p => p.design))].sort());
  // 最新号を初期表示
  if (weeks[0]) { state.week = weeks[0]; $("week").value = weeks[0]; }
  drawTopics(); render();
}).catch(() => { $("sub").textContent = "データを読み込めませんでした"; $("list").innerHTML = `<div class="empty">まだデータがありません。初回の実行後に表示されます。</div>`; });
</script>
</body>
</html>
