name: ① 新着論文を取得(日曜夜)

on:
  schedule:
    # 毎週日曜 22:00(日本時間)= 13:00 UTC。月曜朝に Claude が和訳する
    - cron: "0 13 * * 0"
  workflow_dispatch:       # Actions 画面の「Run workflow」で手動実行もできる
  push:
    branches: [main]
    paths: ["inbox/fetch-now.txt"]   # このファイルを更新して push すると今すぐ取得(Claude 用)

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: PubMed から新着を取得
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.GMAIL_ADDRESS }}
        run: python -m digest.main fetch
      - name: 保存
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add inbox/pending.json
          git diff --cached --quiet || git commit -m "fetch: $(date -u +%F)"
          git push
