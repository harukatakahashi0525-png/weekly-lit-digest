name: 週刊文献ダイジェスト

on:
  schedule:
    # 毎週月曜 8:00(日本時間)= 日曜 23:00 UTC
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "メールを送らずに試す"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 取得・要約・メール送信
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.GMAIL_ADDRESS }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m digest.main --dry-run
          else
            python -m digest.main
          fi

      - name: メール本文を保存
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: output/email.html

      - name: ダッシュボードのデータを更新
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/data/papers.json state/seen.json
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F)"
          git push
